# vHeat_Block: 完整热传导块 (CVPR 2025 vHeat 论文)
# 改动: 层24 SPPF → vHeat_Block, 用完整 HCO+MLP+DropPath 替换简单池化
# 原位替换, 无层号位移
#
# vHeat_Block 结构:
#   Norm1 → HCO(DCT→自适应k→衰减→IDCT→残差→SiLU门控) → DropPath → +残差
#   Norm2 → MLP(1×1 Conv ×4扩张→GELU→1×1 Conv压缩) → DropPath → +残差
#
# args: [c2, t, mlp_ratio, drop_path, layer_scale]
#   c2=1024, t=1.0, mlp_ratio=4.0, drop_path=0.1

# Parameters
nc: 3
scales:
  s: [0.50, 0.50, 1024]

ch: 4
backbone:
  - [-1, 1, Silence, []]  # 0-P1/2
    # visible
  - [0, 1, SilenceChannel, [0,3]]  # 1-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 6
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [0, 1, SilenceChannel, [3,4]]  # 11-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 12-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 13-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 14
  - [-1, 1, Conv, [256, 3, 2]] # 15-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 16
  - [-1, 1, Conv, [512, 3, 2]] # 17-P4/16
  - [-1, 2, C3k2, [512, True]] # 18
  - [-1, 1, Conv, [1024, 3, 2]] # 19-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20
  - [[6, 16], 1, Concat, [1]]  # cat backbone P3   21
  - [[8, 18], 1, Concat, [1]]  # cat backbone P4   22
  - [[10, 20], 1, Concat, [1]]  # cat backbone P5   23

  # vHeat_Block 替换 SPPF: 完整 HCO + MLP + DropPath
  - [-1, 1, vHeat_Block, [1024, 1.0, 4.0, 0.1]] # 24 (replaces SPPF)
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 26
  - [[-1, 22], 1, Concat, [1]] # 27
  - [-1, 2, C3k2, [512, False]] # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 29
  - [[-1, 21], 1, Concat, [1]] # 30
  - [-1, 2, C3k2, [256, False]] # 31 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 32
  - [[-1, 28], 1, Concat, [1]] # 33
  - [-1, 2, C3k2, [512, False]] # 34 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 35
  - [[-1, 25], 1, Concat, [1]] # 36
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37 (P5/32-large)

  - [[31, 34, 37], 1, Detect, [nc]] # 38 Detect(P3, P4, P5)
