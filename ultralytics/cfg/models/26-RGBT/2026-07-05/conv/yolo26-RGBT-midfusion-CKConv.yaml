# C3k2_CKConv: 集成 CKConv 的 C3k2 模块
# 改动: 层4/6/8/10/14/16/18/20 C3k2 → C3k2_CKConv (多尺度十字形卷积)
# 原位替换, 无层号位移
#
# 论文: IEEE (https://ieeexplore.ieee.org/document/11320952)
#
# CKConv 核心机制:
#   1. 多尺度十字形卷积核: 支持 [3, 5, 7] 多种核大小
#   2. 轴向卷积: 每个核大小使用 1×k (水平) + k×1 (垂直) 实现十字形感受野
#   3. 残差连接: body 分支(3×3 DWConv) + head 分支(轴向卷积)
#   4. 多尺度融合: 所有尺度分支拼接后 1×1 融合
#
# 对 RGBT 的价值:
#   - 轴向卷积天然适合处理红外图像的方向性特征
#   - 多尺度设计可以捕获不同大小的目标
#   - 十字形感受野减少计算量，保持感受野范围

# Parameters
nc: 3 # number of classes
scales:
  s: [0.50, 0.50, 1024]

ch: 4
# YOLO26s backbone (RGB + IR mid-fusion)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]  # 0-P1/2
    # visible
  - [0, 1, SilenceChannel, [0,3]]  # 1-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2_CKConv, [256, True, 0.25]]  # 4 (原 C3k2 → C3k2_CKConv)
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2_CKConv, [512, True, 0.25]]  # 6 (原 C3k2 → C3k2_CKConv)
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2_CKConv, [512, True]]  # 8 (原 C3k2 → C3k2_CKConv)
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2_CKConv, [1024, True, 0.5, True]]  # 10 (原 C3k2 → C3k2_CKConv)

  # infrared
  - [ 0, 1, SilenceChannel, [ 3,4 ] ]  # 11-P1/2
  - [ -1, 1, Conv, [ 64, 3, 2 ] ] # 12-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 13-P2/4
  - [ -1, 2, C3k2_CKConv, [ 256, True, 0.25 ] ]  # 14 (原 C3k2 → C3k2_CKConv)
  - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 15-P3/8
  - [ -1, 2, C3k2_CKConv, [ 512, True, 0.25 ] ]  # 16 (原 C3k2 → C3k2_CKConv)
  - [ -1, 1, Conv, [ 512, 3, 2 ] ] # 17-P4/16
  - [ -1, 2, C3k2_CKConv, [ 512, True ] ]  # 18 (原 C3k2 → C3k2_CKConv)
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ] # 19-P5/32
  - [ -1, 2, C3k2_CKConv, [ 1024, True , 0.5, True] ]  # 20 (原 C3k2 → C3k2_CKConv)
  - [[6, 16], 1, Concat, [1]]  # cat backbone P3   21
  - [[8, 18], 1, Concat, [1]]  # cat backbone P4   22
  - [[10, 20], 1, Concat, [1]]  # cat backbone P5   23

  - [ -1, 1, SPPF, [ 1024, 5, 3, True ] ] # 24
  - [ -1, 1, C2PSA, [ 1024 ] ] # 25

# YOLO26s head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 31 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 34 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37 (P5/32-large)

  - [[31, 34, 37], 1, Detect, [nc]] # Detect(P3, P4, P5)
