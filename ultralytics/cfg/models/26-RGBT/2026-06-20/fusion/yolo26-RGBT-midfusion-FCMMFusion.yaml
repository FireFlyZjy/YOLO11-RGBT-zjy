# FCMMFusion: FCM双分支交叉门控融合 (源自FCM-main改造)
# 改动: 层21/22/23 Concat -> FCMMFusion (跨模态交叉门控融合)
# 原位替换, 无层号位移
#
# FCMMFusion 机制:
#   RGB -> Proj -> vis分支 -> SpatialGate(ir) x vis -> 融合输出
#   IR  -> Proj -> ir分支  -> ChannelGate(vis) x ir ->
#
# 对RGBT的价值:
#   - IR的全局统计信息生成空间门控, 帮RGB聚焦热目标区域
#   - RGB的全局统计信息生成通道门控, 帮IR保留视觉纹理通道
#   - 跨模态互补增强, 比简单Concat/add更有针对性
#
# args: [c2, ratio]
#   c2=512 (P3/P4) / 1024 (P5), ratio=4 (中间通道压缩比)

nc: 3
scales:
  s: [0.50, 0.50, 1024]

ch: 4
backbone:
  - [-1, 1, Silence, []]  # 0-P1/2
    # visible
  - [0, 1, SilenceChannel, [0,3]]  # 1-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 6
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [0, 1, SilenceChannel, [3,4]]  # 11-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 12-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 13-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 14
  - [-1, 1, Conv, [256, 3, 2]] # 15-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 16
  - [-1, 1, Conv, [512, 3, 2]] # 17-P4/16
  - [-1, 2, C3k2, [512, True]] # 18
  - [-1, 1, Conv, [1024, 3, 2]] # 19-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20

  # FCMMFusion 替换 Concat: 跨模态交叉门控融合
  - [[6, 16], 1, FCMMFusion, [512, 4]]  # 21-P3 跨模态融合 (replaces Concat)
  - [[8, 18], 1, FCMMFusion, [512, 4]]  # 22-P4 跨模态融合 (replaces Concat)
  - [[10, 20], 1, FCMMFusion, [1024, 4]] # 23-P5 跨模态融合 (replaces Concat)

  - [-1, 1, SPPF, [1024, 5, 3, True]] # 24
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 26
  - [[-1, 22], 1, Concat, [1]] # 27
  - [-1, 2, C3k2, [512, False]] # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 29
  - [[-1, 21], 1, Concat, [1]] # 30
  - [-1, 2, C3k2, [256, False]] # 31 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 32
  - [[-1, 28], 1, Concat, [1]] # 33
  - [-1, 2, C3k2, [512, False]] # 34 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 35
  - [[-1, 25], 1, Concat, [1]] # 36
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37 (P5/32-large)

  - [[31, 34, 37], 1, Detect, [nc]] # 38 Detect(P3, P4, P5)