# YOLO26-RGBT midfusion with EBlock (Enhancement Block for IR features)
# EBlock enhances IR branch features after P3 C3k2, improving thermal modality representation
# Paper: https://github.com/Yooyoo95/CMFADet (EBlock from CMFADet)
# What changed: Inserted EBlock [256] after layer 14 (IR P3 C3k2) as new layer 15
#   - All subsequent IR layers shifted by +1 (15→16, 16→17, ...)
#   - Concat P3 references updated: [[6,16]] → [[6,17]]
#   - Concat P4 references updated: [[8,18]] → [[8,19]]
#   - Concat P5 references updated: [[10,20]] → [[10,21]]
#   - Head references shifted by +1
# Diff summary: New layer 15 EBlock inserted; all downstream layer indices +1

# Parameters
nc: 3
scales:
  s: [0.50, 0.50, 1024]

ch: 4
backbone:
  - [-1, 1, Silence, []]  # 0-P1/2
    # visible
  - [0, 1, SilenceChannel, [0,3]]  # 1-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 6
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [0, 1, SilenceChannel, [3,4]]  # 11-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 12-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 13-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 14
  - [-1, 1, EBlock, [256]] # 15 (NEW: enhance IR features after P3 C3k2)
  - [-1, 1, Conv, [256, 3, 2]] # 16-P3/8 (was 15)
  - [-1, 2, C3k2, [512, False, 0.25]] # 17 (was 16)
  - [-1, 1, Conv, [512, 3, 2]] # 18-P4/16 (was 17)
  - [-1, 2, C3k2, [512, True]] # 19 (was 18)
  - [-1, 1, Conv, [1024, 3, 2]] # 20-P5/32 (was 19)
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 21 (was 20)
  - [[6, 17], 1, Concat, [1]]  # cat backbone P3   22 (was [[6,16]])
  - [[8, 19], 1, Concat, [1]]  # cat backbone P4   23 (was [[8,18]])
  - [[10, 21], 1, Concat, [1]]  # cat backbone P5   24 (was [[10,20]])

  - [-1, 1, SPPF, [1024, 5, 3, True]] # 25 (was 24)
