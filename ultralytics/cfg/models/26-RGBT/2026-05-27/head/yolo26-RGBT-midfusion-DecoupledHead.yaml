# YOLO26 RGB-T midfusion with DecoupledHead replacing Detect
# Module: DecoupledHead separates classification and regression branches
# What changed from baseline (yolo26-RGBT-midfusion.yaml):
#   - Layer 38: Detect -> DecoupledHead [nc, 256] (takes hidc=256 like Detect_ATAH)
#   - All other layers identical to baseline
# Diff summary: 1 replacement in the final detection layer, no layer shifts

# Parameters
nc: 3 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs

ch: 4

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]  # 0-P1/2
    # visible
  - [0, 1, SilenceChannel, [0,3]]  # 1-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [ 0, 1, SilenceChannel, [ 3,4 ] ]  # 11-P1/2
  - [ -1, 1, Conv, [ 64, 3, 2 ] ] # 12-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 13-P2/4
  - [ -1, 2, C3k2, [ 256, False, 0.25 ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 15-P3/8
  - [ -1, 2, C3k2, [ 512, False, 0.25 ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ] # 17-P4/16
  - [ -1, 2, C3k2, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ] # 19-P5/32
  - [ -1, 2, C3k2, [ 1024, True , 0.5, True] ]  #20
  - [[6, 16], 1, Concat, [1]]  # cat backbone P3   21
  - [[8, 18], 1, Concat, [1]]  # cat backbone P4   22
  - [[10, 20], 1, Concat, [1]]  # cat backbone P5   23

  - [ -1, 1, SPPF, [ 1024, 5, 3, True ] ] # 24
  - [ -1, 2, C2PSA, [ 1024 ] ] # 25

# YOLO26 head with DecoupledHead
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 26 up P5 -> P4
  - [[-1, 22], 1, Concat, [1]]                 # 27 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 29 up P4 -> P3
  - [[-1, 21], 1, Concat, [1]]                 # 30 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                # 31 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                 # 32
  - [[-1, 28], 1, Concat, [1]]                 # 33 cat head P4
  - [-1, 2, C3k2, [512, False]]                # 34 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                 # 35
  - [[-1, 25], 1, Concat, [1]]                 # 36 cat head P5
  - [-1, 2, C3k2, [1024, True, 0.5, True]]    # 37 (P5/32-large)

  - [[31, 34, 37], 1, DecoupledHead, [nc, 256]] # 38 DecoupledHead(P3, P4, P5)
