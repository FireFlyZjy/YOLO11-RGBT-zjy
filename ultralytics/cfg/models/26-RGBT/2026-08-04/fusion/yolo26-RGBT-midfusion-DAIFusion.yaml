# DAIFusion: 深度自适应注入融合 (源自 VCP-DCN, ECCV 2026)
# 改动: 层21/22/23 Concat -> DAIFusion (原型自适应注入融合)
# 原位替换, 无层号位移
#
# DAI 机制 (RGB-D -> RGB-T 适配):
#   1. 可学习原型: 模态一致性原型(共享) + RGB/IR特异性原型
#   2. 内容-原型余弦相似度 -> 自适应权重 W_r, W_d
#   3. 特征分解: 一致性特征 F_c = W_r*rgb + W_d*ir
#                特异性特征 F_s = (1-W_r)*rgb, (1-W_d)*ir
#   4. concat(F_c, F_s_rgb, F_s_ir) -> 1x1 Conv -> DWConv3x3 -> 输出
#
# 对RGBT的价值:
#   - 解决模态同质化: Concat 简单拼接导致两模态特征趋同
#   - 原型引导: 一致性原型捕获共享信息, 特异性原型保留独有信息
#   - 内容自适应: 不同图像的RGB/IR贡献权重不同, 动态调节
#
# args: [c2]
#   c2=512 (P3/P4) / 1024 (P5)

nc: 3
scales:
  s: [0.50, 0.50, 1024]

ch: 4
backbone:
  - [-1, 1, Silence, []]  # 0-P1/2
    # visible
  - [0, 1, SilenceChannel, [0,3]]  # 1-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 6
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [0, 1, SilenceChannel, [3,4]]  # 11-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 12-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 13-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 14
  - [-1, 1, Conv, [256, 3, 2]] # 15-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 16
  - [-1, 1, Conv, [512, 3, 2]] # 17-P4/16
  - [-1, 2, C3k2, [512, True]] # 18
  - [-1, 1, Conv, [1024, 3, 2]] # 19-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20

  # DAIFusion 替换 Concat: 原型自适应注入融合
  - [[6, 16], 1, DAIFusion, [512]]  # 21-P3 跨模态融合 (replaces Concat)
  - [[8, 18], 1, DAIFusion, [512]]  # 22-P4 跨模态融合 (replaces Concat)
  - [[10, 20], 1, DAIFusion, [1024]] # 23-P5 跨模态融合 (replaces Concat)

  - [-1, 1, SPPF, [1024, 5, 3, True]] # 24
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 26
  - [[-1, 22], 1, Concat, [1]] # 27
  - [-1, 2, C3k2, [512, False]] # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 29
  - [[-1, 21], 1, Concat, [1]] # 30
  - [-1, 2, C3k2, [256, False]] # 31 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 32
  - [[-1, 28], 1, Concat, [1]] # 33
  - [-1, 2, C3k2, [512, False]] # 34 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 35
  - [[-1, 25], 1, Concat, [1]] # 36
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37 (P5/32-large)

  - [[31, 34, 37], 1, Detect, [nc]] # 38 Detect(P3, P4, P5)
