# C: StarFusion — Implicit High-Order Cross-Modal Interaction via Star Operations
# 创新: StarBlock星操作零参数高阶交互 + AFF注意力融合 + TOST统计注意力O(n) + CARAFE内容感知上采样
# 原位替换, 无层号位移

nc: 3
scales:
  s: [0.50, 0.50, 1024]

ch: 4
backbone:
  - [-1, 1, Silence, []]                                              # 0
  - [0, 1, SilenceChannel, [0,3]]                                     # 1-VIS
  - [-1, 1, Conv, [64, 3, 2]]                                        # 2
  - [-1, 1, Conv, [128, 3, 2]]                                       # 3
  - [-1, 2, C3k2, [256, False, 0.25]]                                # 4-P3 RGB
  - [-1, 1, Conv, [256, 3, 2]]                                       # 5
  - [-1, 2, StarBlock, [512]]                                         # 6-P4 RGB ← StarBlock (星操作隐式高维)
  - [-1, 1, Conv, [512, 3, 2]]                                       # 7
  - [-1, 2, C3k2, [512, True]]                                        # 8-P5 RGB
  - [-1, 1, Conv, [1024, 3, 2]]                                      # 9
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                          # 10
  - [0, 1, SilenceChannel, [3,4]]                                     # 11-IR
  - [-1, 1, Conv, [64, 3, 2]]                                        # 12
  - [-1, 1, Conv, [128, 3, 2]]                                       # 13
  - [-1, 2, C3k2, [256, False, 0.25]]                                # 14-P3 IR
  - [-1, 1, Conv, [256, 3, 2]]                                       # 15
  - [-1, 2, StarBlock, [512]]                                         # 16-P4 IR ← StarBlock (星操作隐式高维)
  - [-1, 1, Conv, [512, 3, 2]]                                       # 17
  - [-1, 2, C3k2, [512, True]]                                        # 18-P5 IR
  - [-1, 1, Conv, [1024, 3, 2]]                                      # 19
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                          # 20
  - [[6, 16], 1, Att_AFF, [512]]                                      # 21-P3 ← AFF (注意力特征融合)
  - [[8, 18], 1, Att_AFF, [512]]                                      # 22-P4 ← AFF
  - [[10, 20], 1, Att_AFF, [1024]]                                    # 23-P5 ← AFF
  - [-1, 1, TOST, [1024]]                                             # 24 ← TOST (统计注意力O(n))
  - [-1, 2, C2PSA, [1024]]                                           # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 26
  - [[-1, 22], 1, Concat, [1]]                                        # 27
  - [-1, 2, C3k2, [512, False]]                                       # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 29
  - [[-1, 21], 1, Concat, [1]]                                        # 30
  - [-1, 2, C3k2, [256, False]]                                       # 31 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                                       # 32
  - [[-1, 28], 1, Concat, [1]]                                        # 33
  - [-1, 2, C3k2, [512, False]]                                       # 34 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                                       # 35
  - [[-1, 25], 1, Concat, [1]]                                        # 36
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                          # 37 (P5/32)
  - [[31, 34, 37], 1, DecoupledHead, [nc, 256]]                       # 38 ← DecoupledHead
