# RFAF_Fusion: 雷达特征自适应融合 (来自 MARSS, CVPR2026)
# 改动: 层21/22/23 Concat → RFAF_Fusion (十字形感受野+多尺度空洞卷积)
# 原位替换, 无层号位移
#
# 论文: MARSS: Radar Semantic Segmentation via Modular Attention and State Space Models
# 来源: CVPR 2026
# 论文链接: https://openaccess.thecvf.com/content/CVPR2026/papers/Chen_MARSS_Radar_Semantic_Segmentation_via_Modular_Attention_and_State_Space_CVPR_2026_paper.pdf
#
# RFAF 核心机制:
#   1. Stage I: 多尺度融合注意力 (通道+空间)
#   2. Stage II: 区域级注意力 (十字形感受野)
#   3. 多尺度空洞卷积分支
#   4. 残差连接
#
# 对 RGBT 的价值:
#   - 十字形感受野分别处理水平和垂直邻域
#   - 多尺度空洞卷积捕获不同尺度的上下文
#   - 区域级注意力在不同空间区域自适应选择主导模态

# Parameters
nc: 3 # number of classes
scales:
  s: [0.50, 0.50, 1024]

ch: 4
# YOLO26s backbone (RGB + IR mid-fusion)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]  # 0-P1/2
    # visible
  - [0, 1, SilenceChannel, [0,3]]  # 1-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [ 0, 1, SilenceChannel, [ 3,4 ] ]  # 11-P1/2
  - [ -1, 1, Conv, [ 64, 3, 2 ] ] # 12-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 13-P2/4
  - [ -1, 2, C3k2, [ 256, False, 0.25 ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 15-P3/8
  - [ -1, 2, C3k2, [ 512, False, 0.25 ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ] # 17-P4/16
  - [ -1, 2, C3k2, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ] # 19-P5/32
  - [ -1, 2, C3k2, [ 1024, True , 0.5, True] ]  #20
  - [[6, 16], 1, RFAF_Fusion, [256]]  # P3 融合 21 (原 Concat → RFAF_Fusion)
  - [[8, 18], 1, RFAF_Fusion, [512]]  # P4 融合 22 (原 Concat → RFAF_Fusion)
  - [[10, 20], 1, RFAF_Fusion, [1024]]  # P5 融合 23 (原 Concat → RFAF_Fusion)

  - [ -1, 1, SPPF, [ 1024, 5, 3, True ] ] # 24
  - [ -1, 1, C2PSA, [ 1024 ] ] # 25

# YOLO26s head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 31 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 34 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37 (P5/32-large)

  - [[31, 34, 37], 1, Detect, [nc]] # Detect(P3, P4, P5)
