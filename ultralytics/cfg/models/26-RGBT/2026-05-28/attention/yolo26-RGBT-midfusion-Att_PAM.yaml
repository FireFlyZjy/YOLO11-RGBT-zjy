# YOLO26 RGB-T midfusion with Att_PAM (Position Attention Module)
# Replaces SPPF (layer 24) with Att_PAM
# Note: O((H*W)^2) complexity, best on P5 (smallest feature map)
# Args: [c2]
nc: 3
scales:
  s: [0.50, 0.50, 1024]
ch: 4

backbone:
  # Stem - Visible branch
  - [-1, 1, Silence, []]                                            # 0
  - [0, 1, SilenceChannel, [0,3]]                                   # 1
  - [-1, 1, Conv, [64, 3, 2]]                                       # 2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 3
  - [-1, 2, C3k2, [256, False, 0.25]]                               # 4
  - [-1, 1, Conv, [256, 3, 2]]                                      # 5
  - [-1, 2, C3k2, [512, False, 0.25]]                               # 6
  - [-1, 1, Conv, [512, 3, 2]]                                      # 7
  - [-1, 2, C3k2, [512, True]]                                      # 8
  - [-1, 1, Conv, [1024, 3, 2]]                                     # 9
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                         # 10

  # Stem - Infrared branch
  - [0, 1, SilenceChannel, [3,4]]                                   # 11
  - [-1, 1, Conv, [64, 3, 2]]                                       # 12
  - [-1, 1, Conv, [128, 3, 2]]                                      # 13
  - [-1, 2, C3k2, [256, False, 0.25]]                               # 14
  - [-1, 1, Conv, [256, 3, 2]]                                      # 15
  - [-1, 2, C3k2, [512, False, 0.25]]                               # 16
  - [-1, 1, Conv, [512, 3, 2]]                                      # 17
  - [-1, 2, C3k2, [512, True]]                                      # 18
  - [-1, 1, Conv, [1024, 3, 2]]                                     # 19
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                         # 20

  # Midfusion - Cross-modal feature fusion
  - [[6, 16], 1, Concat, [1]]                                       # 21
  - [[8, 18], 1, Concat, [1]]                                       # 22
  - [[10, 20], 1, Concat, [1]]                                      # 23

  # Neck
  - [-1, 1, Att_PAM, [1024]]                                        # 24
  - [-1, 2, C2PSA, [1024]]                                          # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                     # 26
  - [[-1, 22], 1, Concat, [1]]                                      # 27
  - [-1, 2, C3k2, [512, False]]                                     # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                     # 29
  - [[-1, 21], 1, Concat, [1]]                                      # 30
  - [-1, 2, C3k2, [256, False]]                                     # 31
  - [-1, 1, Conv, [256, 3, 2]]                                     # 32
  - [[-1, 28], 1, Concat, [1]]                                      # 33
  - [-1, 2, C3k2, [512, False]]                                     # 34
  - [-1, 1, Conv, [512, 3, 2]]                                     # 35
  - [[-1, 25], 1, Concat, [1]]                                      # 36
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                         # 37
  - [[31, 34, 37], 1, Detect, [nc]]                                 # 38
