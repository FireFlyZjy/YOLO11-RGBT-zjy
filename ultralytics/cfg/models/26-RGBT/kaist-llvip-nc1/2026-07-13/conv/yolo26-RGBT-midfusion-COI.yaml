  - [0, 1, SilenceChannel, [0,3]]  # 1-vis
  - [-1, 1, COI, [64, 3, 2]]   # 2 Conv→COI (stride=2降采样)
  - [-1, 1, COI, [128, 3, 2]]  # 3 Conv→COI (stride=2降采样)
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, COI, [256]]   # 5 Conv→COI
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [0, 1, SilenceChannel, [3,4]]  # 11-ir
  - [-1, 1, COI, [64, 3, 2]]   # 12 Conv→COI (stride=2降采样)
  - [-1, 1, COI, [128, 3, 2]]  # 13 Conv→COI (stride=2降采样)
