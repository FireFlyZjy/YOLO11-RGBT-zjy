  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20

  - [[6, 16], 1, Concat, [1]]  # 21
  - [[8, 18], 1, Concat, [1]]  # 22
  - [[10, 20], 1, Concat, [1]]  # 23
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 24
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 31
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 34
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37
  - [[31, 34, 37], 1, Detect, [nc]]
