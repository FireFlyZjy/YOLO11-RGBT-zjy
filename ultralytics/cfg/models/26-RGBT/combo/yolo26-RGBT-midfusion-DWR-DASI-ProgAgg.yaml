# DWR-DASI-ProgAgg: 三模块组合 — 非对称浅层增强 + Neck渐进聚合
# 改动: RGB分支 层2 Conv→DWR (d=1,3,5, 纹理增强, stride=2)
#       IR分支  层12 Conv→DASI (d=2,4,6,8, 小目标增强, stride=2)
#       Neck 层32 插入 ProgressiveAgg (PLF+LCAR渐进聚合)
# 层号位移: neck插入1层, 后续层号+2
#
# 组合理由:
#   DWR mAP50=0.883 (浅层第1) + DASI mAP50=0.886 (精度第1) + ProgressiveAgg mAP50=0.8654 (neck第1)
#   三模块覆盖: 非对称浅层(backbone) + 渐进聚合(neck), 理论上最优组合
#   - RGB用DWR: 纹理/边缘丰富, 需精细多尺度(d=1,3,5)
#   - IR用DASI: 小目标稀疏, 需大感受野(d=2,4,6,8)
#   - Neck用ProgAgg: P3/P4/P5渐进融合, 充分利用增强后的多尺度特征

nc: 3
scales:
  s: [0.50, 0.50, 1024]
ch: 4

backbone:
  - [-1, 1, Silence, []]  # 0
  - [0, 1, SilenceChannel, [0,3]]  # 1-vis

  # RGB 分支: DWR 多空洞率残差 (纹理增强)
  - [-1, 1, DWR, [64, 2]]       # 2 Conv→DWR (P1/2, stride=2)
  - [-1, 1, Conv, [128, 3, 2]]  # 3
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]  # 5
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]  # 7
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 9
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # IR 分支: DASI 多空洞率选择 (小目标增强)
  - [0, 1, SilenceChannel, [3,4]]  # 11-ir
  - [-1, 1, DASI, [64, 2]]      # 12 Conv→DASI (P1/2, stride=2)
  - [-1, 1, Conv, [128, 3, 2]]  # 13
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]  # 15
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]  # 17
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 19
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20

  - [[6, 16], 1, Concat, [1]]  # 21 P3
  - [[8, 18], 1, Concat, [1]]  # 22 P4
  - [[10, 20], 1, Concat, [1]] # 23 P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 24
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 31 (P3)

  # ProgressiveAgg: [P3最大, P4中, P5最小] → 输出P3分辨率
  - [[31, 22, 23], 1, ProgressiveAgg, [256, True]] # 32

  # 融合P3
  - [[31, 32], 1, Concat, [1]] # 33
  - [-1, 2, C3k2, [256, False]] # 34 (P3_enh)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 37 (P4)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 40 (P5)
  - [[34, 37, 40], 1, Detect, [nc]]
