# COI-DASI-Asymmetric: 模态特异性非对称 backbone 增强
# 改动: RGB分支 层2/3/5 Conv→COI (三重残差, 纹理增强)
#       IR分支  层12 Conv→DASI (多空洞率, 红外小目标增强)
# 两分支 stride 一致, 空间分辨率匹配, Concat 无冲突
# 原位替换, 无层号位移
# 创新: 首次在 RGB-T 检测中提出模态特异性 backbone 非对称设计
# (从 2026-08-02/conv/ 迁移至 combo/ 统一管理)

nc: 3
scales:
  s: [0.50, 0.50, 1024]
ch: 4

backbone:
  - [-1, 1, Silence, []]  # 0
  - [0, 1, SilenceChannel, [0,3]]  # 1-vis

  # RGB 分支: COI 三重残差 (纹理增强)
  - [-1, 1, COI, [64, 3, 2]]   # 2 Conv→COI (P1/2, stride=2)
  - [-1, 1, COI, [128, 3, 2]]  # 3 Conv→COI (P2/4, stride=2)
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, COI, [256, 3, 2]]   # 5 Conv→COI (P3/8, stride=2)
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # IR 分支: DASI 多空洞率 (红外小目标增强)
  - [0, 1, SilenceChannel, [3,4]]  # 11-ir
  - [-1, 1, DASI, [64, 2]]    # 12 Conv→DASI (P1/2, stride=2)
  - [-1, 1, Conv, [128, 3, 2]]  # 13 标准 Conv
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]  # 15 标准 Conv
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20

  - [[6, 16], 1, Concat, [1]]  # 21
  - [[8, 18], 1, Concat, [1]]  # 22
  - [[10, 20], 1, Concat, [1]]  # 23
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 24
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 31
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 34
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37
  - [[31, 34, 37], 1, Detect, [nc]]
