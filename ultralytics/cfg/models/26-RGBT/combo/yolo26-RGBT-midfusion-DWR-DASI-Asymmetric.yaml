# DWR-DASI-Asymmetric: 模态特异性非对称浅层增强
# 改动: RGB分支 层2 Conv→DWR (多空洞率d=1,3,5, 纹理增强)
#       IR分支  层12 Conv→DASI (多空洞率d=2,4,6,8, 小目标增强)
# 两分支 stride=2 一致, 空间分辨率匹配, Concat 无冲突
# 原位替换, 无层号位移
#
# 组合理由:
#   DWR mAP50=0.883 (当前最高) + DASI mAP50=0.886 (精度第1)
#   两者均为多空洞率浅层增强, 但机制互补:
#   - DWR: 3分支并行(d=1,3,5) + 残差, 适合RGB纹理(需精细边缘)
#   - DASI: 4级选择(d=2,4,6,8) + 自适应集成, 适合IR小目标(需大感受野)
#   非对称设计: 不同模态用不同增强策略, 发挥模态特异性

nc: 3
scales:
  s: [0.50, 0.50, 1024]
ch: 4

backbone:
  - [-1, 1, Silence, []]  # 0
  - [0, 1, SilenceChannel, [0,3]]  # 1-vis

  # RGB 分支: DWR 多空洞率残差 (纹理增强)
  - [-1, 1, DWR, [64, 2]]   # 2 Conv→DWR (P1/2, stride=2)
  - [-1, 1, Conv, [128, 3, 2]] # 3
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 5
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # IR 分支: DASI 多空洞率选择 (小目标增强)
  - [0, 1, SilenceChannel, [3,4]]  # 11-ir
  - [-1, 1, DASI, [64, 2]]   # 12 Conv→DASI (P1/2, stride=2)
  - [-1, 1, Conv, [128, 3, 2]] # 13
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 15
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20

  - [[6, 16], 1, Concat, [1]]  # 21 P3
  - [[8, 18], 1, Concat, [1]]  # 22 P4
  - [[10, 20], 1, Concat, [1]] # 23 P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 24
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 31
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 34
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37
  - [[31, 34, 37], 1, Detect, [nc]]
