# COI-DASI-ProgAgg: 三机制三位置组合 (2026-08-11)
# 改动: 层2/12 DASI (浅层注意力, 无stride分辨率提升)
#       层3/13,5/15 COI (轻量三重残差卷积, 带stride)
#       Neck 层32 插入 ProgressiveAgg (渐进多尺度聚合)
# 依据: DASI(0.8860) + COI(0.8799) + ProgressiveAgg(0.8654) 三个类别最优
#       机制互补: 注意力(浅层) + 卷积(中浅层) + 聚合(neck), 不同位置不冲突
# 层号位移: neck 插入1层, 后续层号+2

nc: 3
scales:
  s: [0.50, 0.50, 1024]
ch: 4

backbone:
  - [-1, 1, Silence, []]  # 0
  - [0, 1, SilenceChannel, [0,3]]  # 1-vis
  - [-1, 1, DASI, [64]]        # 2 Conv→DASI (无stride, 分辨率提升)
  - [-1, 1, COI, [128, 3, 2]]  # 3 Conv→COI (stride=2)
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, COI, [256, 3, 2]]  # 5 Conv→COI (stride=2)
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 7
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 9
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [0, 1, SilenceChannel, [3,4]]  # 11-ir
  - [-1, 1, DASI, [64]]        # 12 Conv→DASI (无stride)
  - [-1, 1, COI, [128, 3, 2]]  # 13 Conv→COI (stride=2)
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, COI, [256, 3, 2]]  # 15 Conv→COI (stride=2)
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 17
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 19
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20

  - [[6, 16], 1, Concat, [1]]  # 21 P3
  - [[8, 18], 1, Concat, [1]]  # 22 P4
  - [[10, 20], 1, Concat, [1]] # 23 P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 24
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 31 (P3)

  # ProgressiveAgg: [P3最大, P4中, P5最小] → 输出P3分辨率
  - [[31, 22, 23], 1, ProgressiveAgg, [256, True]] # 32

  # 融合P3
  - [[31, 32], 1, Concat, [1]] # 33
  - [-1, 2, C3k2, [256, False]] # 34 (P3_enh)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 37 (P4)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 40 (P5)
  - [[34, 37, 40], 1, Detect, [nc]]
