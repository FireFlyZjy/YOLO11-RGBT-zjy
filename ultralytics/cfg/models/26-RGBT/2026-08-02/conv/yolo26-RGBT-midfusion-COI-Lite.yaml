# COI-Lite: 选择性深度 — 仅替换最浅层
# 改动: 层2/12 Conv→COI (P1/2最浅层, stride=2)
#       层3/5/13/15 保持 Conv (标准降采样)
# 原位替换, 无层号位移
# 创新: 选择性深度, FLOPs大幅降低, 消融对比 COI-6层 vs COI-2层

nc: 3
scales:
  s: [0.50, 0.50, 1024]
ch: 4

backbone:
  - [-1, 1, Silence, []]  # 0
  - [0, 1, SilenceChannel, [0,3]]  # 1-vis
  - [-1, 1, COI, [64, 3, 2]]   # 2 Conv→COI (P1/2, stride=2) — 仅此层
  - [-1, 1, Conv, [128, 3, 2]]  # 3 标准 Conv
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]  # 5 标准 Conv
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 10

  # infrared
  - [0, 1, SilenceChannel, [3,4]]  # 11-ir
  - [-1, 1, COI, [64, 3, 2]]   # 12 Conv→COI (P1/2, stride=2) — 仅此层
  - [-1, 1, Conv, [128, 3, 2]]  # 13 标准 Conv
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]  # 15 标准 Conv
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 20

  - [[6, 16], 1, Concat, [1]]  # 21
  - [[8, 18], 1, Concat, [1]]  # 22
  - [[10, 20], 1, Concat, [1]]  # 23
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 24
  - [-1, 2, C2PSA, [1024]] # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 31
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 34
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 37
  - [[31, 34, 37], 1, Detect, [nc]]
