# Ultralytics YOLO11 RGBT midfusion with SFEM + IR_AFAB (非对称模态专用骨干)
# 基于模板: yolo26-RGBT-midfusion.yaml
# 修改日期: 2026-05-19
# 来源: CMFADet
#
# 【与基线模板的差异】
# ~ RGB分支P3: C3k2 → Att_SFEM (空间-频率增强: FFT + Scharr边缘检测)
# ~ IR分支P3:  C3k2 → Att_IRAFAB (自适应多核深度卷积 + 门控线性单元)
# ~ 其余层号不变
#
nc: 3
scales:
  s: [0.50, 0.50, 1024]

ch: 4
backbone:
  - [-1, 1, Silence, []]
    # visible
  - [0, 1, SilenceChannel, [0,3]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, Att_SFEM, [256, False, 1, 0.25]]   # 4-P3 RGB: SFEM ← 原C3k2 (c2,shortcut,g,e)
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]

    # infrared
  - [0, 1, SilenceChannel, [3,4]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, Att_IRAFAB, [256, False, 0.25, 1, True]] # 14-P3 IR: IRAFAB ← 原C3k2 (c2,c3k,e,g,shortcut)
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]
  - [[6, 16], 1, Concat, [1]]
  - [[8, 18], 1, Concat, [1]]
  - [[10, 20], 1, Concat, [1]]

  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]
  - [[31, 34, 37], 1, Detect, [nc]]
