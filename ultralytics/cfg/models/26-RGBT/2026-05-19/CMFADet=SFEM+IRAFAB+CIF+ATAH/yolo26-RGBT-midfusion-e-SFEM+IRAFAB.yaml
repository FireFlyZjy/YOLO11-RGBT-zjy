# 消融实验 (e): SFEM + IR_AFAB 双模块
# 改动: RGB-P3 C3k2 → Att_SFEM, IR-P3 C3k2 → Att_IRAFAB
# 其余与 Baseline 完全一致
# 日期: 2026-05-26

nc: 3
scales:
  s: [0.50, 0.50, 1024]

ch: 4
backbone:
  - [-1, 1, Silence, []]                                              # 0
    # visible branch
  - [0, 1, SilenceChannel, [0,3]]                                     # 1
  - [-1, 1, Conv, [64, 3, 2]]                                        # 2
  - [-1, 1, Conv, [128, 3, 2]]                                       # 3
  - [-1, 2, Att_SFEM, [256, False, 1, 0.25]]                         # 4-P3 RGB ← SFEM
  - [-1, 1, Conv, [256, 3, 2]]                                       # 5
  - [-1, 2, C3k2, [512, False, 0.25]]                                # 6-P4 RGB
  - [-1, 1, Conv, [512, 3, 2]]                                       # 7
  - [-1, 2, C3k2, [512, True]]                                        # 8-P5 RGB
  - [-1, 1, Conv, [1024, 3, 2]]                                      # 9
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                          # 10

    # infrared branch
  - [0, 1, SilenceChannel, [3,4]]                                     # 11
  - [-1, 1, Conv, [64, 3, 2]]                                        # 12
  - [-1, 1, Conv, [128, 3, 2]]                                       # 13
  - [-1, 2, Att_IRAFAB, [256, False, 0.25, 1, True]]                 # 14-P3 IR ← IRAFAB
  - [-1, 1, Conv, [256, 3, 2]]                                       # 15
  - [-1, 2, C3k2, [512, False, 0.25]]                                # 16-P4 IR
  - [-1, 1, Conv, [512, 3, 2]]                                       # 17
  - [-1, 2, C3k2, [512, True]]                                        # 18-P5 IR
  - [-1, 1, Conv, [1024, 3, 2]]                                      # 19
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                          # 20

  # ---- 双模态融合 (标准 Concat) ----
  - [[6, 16], 1, Concat, [1]]                                         # 21
  - [[8, 18], 1, Concat, [1]]                                         # 22
  - [[10, 20], 1, Concat, [1]]                                        # 23

  - [-1, 1, SPPF, [1024, 5, 3, True]]                                # 24
  - [-1, 2, C2PSA, [1024]]                                           # 25

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 26
  - [[-1, 22], 1, Concat, [1]]                                        # 27
  - [-1, 2, C3k2, [512, False]]                                       # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                       # 29
  - [[-1, 21], 1, Concat, [1]]                                        # 30
  - [-1, 2, C3k2, [256, False]]                                       # 31 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                                       # 32
  - [[-1, 28], 1, Concat, [1]]                                        # 33
  - [-1, 2, C3k2, [512, False]]                                       # 34 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                                       # 35
  - [[-1, 25], 1, Concat, [1]]                                        # 36
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                          # 37 (P5/32)
  - [[31, 34, 37], 1, Detect, [nc]]                                   # 38 标准检测头
