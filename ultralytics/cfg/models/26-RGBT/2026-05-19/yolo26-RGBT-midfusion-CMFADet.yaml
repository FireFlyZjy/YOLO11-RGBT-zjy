# Ultralytics YOLO11 RGBT midfusion - Full CMFADet Integration
# 基于模板: yolo26-RGBT-midfusion.yaml
# 修改日期: 2026-05-19
# 来源: CMFADet - Cross-Modality Feature Adaptive Interaction for RGB-IR Detection
#
# 【与基线模板的差异】(全部4个CMFADet模块)
# ~ RGB P3: C3k2 → Att_SFEM (FFT频域 + Scharr空间边缘, 双路径增强)
# ~ IR P3:  C3k2 → Att_IRAFAB (自适应多核DWConv + ConvGLU, 红外专用)
# ~ 融合:   Concat → Att_CIFusion (交叉交换通道注意力, 双向信息传递)
# ~ 部分Conv → Conv (5路边缘感知卷积, 训练时并行推理融合)
#
nc: 3
scales:
  s: [0.50, 0.50, 1024]

ch: 4
backbone:
  - [-1, 1, Silence, []]
    # visible branch
  - [0, 1, SilenceChannel, [0,3]]
  - [-1, 1, Conv, [64, 3, 2]]          # Conv: 细节增强卷积
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, Att_SFEM, [256, False, 1, 0.25]]  # SFEM: 频域+空间双路径 (RGB专用)
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]

    # infrared branch
  - [0, 1, SilenceChannel, [3,4]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, Att_IRAFAB, [256, False, 0.25, 1, True]]  # IRAFAB: 自适应多核DWConv (IR专用) (c2,c3k,e,g,shortcut)
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]

  # ---- CIFusion 跨模态交叉交换融合 ----
  - [[6, 16], 1, Att_CIFusion, [512]]   # 21-P3: RGB↔IR双向信息传递
  - [[8, 18], 1, Att_CIFusion, [512]]   # 22-P4: 交叉交换通道注意力
  - [[10, 20], 1, Att_CIFusion, [1024]] # 23-P5: 深层特征跨模态交互

  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]
  - [[31, 34, 37], 1, Detect, [nc]]
